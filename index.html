<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Dome — AR Augment</title>
<style>
  html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#111; }
  #ar-container { width:100%; height:100%; }
  #hint {
    position:fixed; left:50%; bottom:28px; transform:translateX(-50%);
    font-family:ui-monospace, Menlo, monospace; font-size:13px; letter-spacing:.08em;
    color:#fff; background:rgba(32,40,96,.82); border:1px solid #4a56a8;
    padding:10px 18px; border-radius:999px; pointer-events:none; z-index:10;
    transition:opacity .6s; text-align:center;
  }
  #hint.hidden { opacity:0; }
</style>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/" } }
</script>
</head>
<body>
<div id="ar-container"></div>
<div id="hint">Point your camera at the artwork</div>
<script type="module">
import 'https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js';
/* Palette sampled from the artwork's linework */
const BLUE = 0x2a3670;
const BLUE_DARK = 0x202860;

const { MindARThree } = window.MINDAR.IMAGE;
const THREE = window.MINDAR.IMAGE.THREE;

/* the image target ships gzipped & chunked (repo file-size friendly); reassemble + decompress in-browser */
async function loadTarget() {
  const parts = await Promise.all(['aa','ab','ac','ad','ae'].map(async p =>
    new Uint8Array(await (await fetch('./artwork.mind.gz.' + p)).arrayBuffer())));
  const total = parts.reduce((n, p) => n + p.length, 0);
  const buf = new Uint8Array(total);
  let off = 0; for (const p of parts) { buf.set(p, off); off += p.length; }
  const ds = new DecompressionStream('gzip');
  const plain = await new Response(new Blob([buf]).stream().pipeThrough(ds)).arrayBuffer();
  return URL.createObjectURL(new Blob([plain]));
}

const targetUrl = await loadTarget();
const mindarThree = new MindARThree({
  container: document.querySelector('#ar-container'),
  imageTargetSrc: targetUrl,
});
const { renderer, scene, camera } = mindarThree;
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

const anchor = mindarThree.addAnchor(0);
const root = new THREE.Group();
anchor.group.add(root);

/* ---------- lighting ---------- */
scene.add(new THREE.AmbientLight(0xffffff, 0.55));
const key = new THREE.DirectionalLight(0xfff4e0, 1.4);
key.position.set(0.6, 1.2, 0.9);
scene.add(key);
const rim = new THREE.DirectionalLight(0x88aaff, 0.6);
rim.position.set(-0.8, 0.5, -0.6);
scene.add(rim);

/* ---------- helpers ---------- */
const domeMat = new THREE.MeshStandardMaterial({ color: BLUE, roughness: 0.55, metalness: 0.15, flatShading: true });

/* thick edge "strokes": cylinders between vertices, radius tuned to the painting's stroke weight */
function tubeBetween(a, b, r, mat) {
  const dir = new THREE.Vector3().subVectors(b, a);
  const len = dir.length();
  const geo = new THREE.CylinderGeometry(r, r, len, 6, 1, false);
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.copy(a).addScaledVector(dir, 0.5);
  mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.clone().normalize());
  return mesh;
}

/* ---------- low-poly abstract dome ---------- */
const R = 0.34;           /* dome radius relative to target width */
const STROKE = 0.011;     /* stroke thickness — matches the artwork's heavy blue lines */
const dome = new THREE.Group();

const geo = new THREE.SphereGeometry(R, 9, 5, 0, Math.PI * 2, 0, Math.PI / 2); // low-poly hemisphere
geo.deleteAttribute('normal'); geo.deleteAttribute('uv');
const pos = geo.getAttribute('position');
const index = geo.getIndex();

const seen = new Set();
const vA = new THREE.Vector3(), vB = new THREE.Vector3();
function addEdge(i, j) {
  const k = i < j ? i + '_' + j : j + '_' + i;
  if (seen.has(k)) return; seen.add(k);
  vA.fromBufferAttribute(pos, i); vB.fromBufferAttribute(pos, j);
  if (vA.distanceTo(vB) < 1e-5) return;
  dome.add(tubeBetween(vA, vB, STROKE, domeMat));
}
for (let f = 0; f < index.count; f += 3) {
  addEdge(index.getX(f), index.getX(f + 1));
  addEdge(index.getX(f + 1), index.getX(f + 2));
  addEdge(index.getX(f + 2), index.getX(f));
}
/* node caps at vertices, like the painting's junctions */
const nodeGeo = new THREE.IcosahedronGeometry(STROKE * 1.7, 0);
const seenV = new Set();
for (let i = 0; i < pos.count; i++) {
  vA.fromBufferAttribute(pos, i);
  const k = vA.toArray().map(n => n.toFixed(3)).join(',');
  if (seenV.has(k)) continue; seenV.add(k);
  const n = new THREE.Mesh(nodeGeo, domeMat);
  n.position.copy(vA);
  dome.add(n);
}
/* base ring */
const ring = new THREE.Mesh(new THREE.TorusGeometry(R, STROKE, 6, 18), domeMat);
ring.rotation.x = Math.PI / 2;
dome.add(ring);
/* faint interior shell so the dome reads as a volume */
const shell = new THREE.Mesh(
  new THREE.SphereGeometry(R * 0.995, 9, 5, 0, Math.PI * 2, 0, Math.PI / 2),
  new THREE.MeshStandardMaterial({ color: BLUE, transparent: true, opacity: 0.07, flatShading: true, side: THREE.DoubleSide, depthWrite: false })
);
dome.add(shell);
root.add(dome);

/* floor disc shadow */
const floor = new THREE.Mesh(
  new THREE.CircleGeometry(R * 0.96, 18),
  new THREE.MeshBasicMaterial({ color: BLUE_DARK, transparent: true, opacity: 0.18, depthWrite: false })
);
floor.rotation.x = -Math.PI / 2; floor.position.y = 0.001;
root.add(floor);

/* ---------- low-poly cat & mouse ---------- */
function makeCat() {
  const c = new THREE.Group();
  const body = new THREE.Mesh(new THREE.IcosahedronGeometry(0.030, 0), domeMat);
  body.scale.set(1.5, 1.0, 0.9);
  c.add(body);
  const head = new THREE.Mesh(new THREE.IcosahedronGeometry(0.020, 0), domeMat);
  head.position.set(0.042, 0.016, 0);
  c.add(head);
  const earGeo = new THREE.ConeGeometry(0.009, 0.018, 4);
  const earL = new THREE.Mesh(earGeo, domeMat); earL.position.set(0.042, 0.038, 0.010);
  const earR = new THREE.Mesh(earGeo, domeMat); earR.position.set(0.042, 0.038, -0.010);
  c.add(earL, earR);
  const eyeGeo = new THREE.IcosahedronGeometry(0.004, 0);
  const eyeMat = new THREE.MeshBasicMaterial({ color: 0xffe08a });
  const eL = new THREE.Mesh(eyeGeo, eyeMat); eL.position.set(0.058, 0.020, 0.009);
  const eR = new THREE.Mesh(eyeGeo, eyeMat); eR.position.set(0.058, 0.020, -0.009);
  c.add(eL, eR);
  const legGeo = new THREE.ConeGeometry(0.006, 0.026, 4);
  [[0.022, 0.012], [0.022, -0.012], [-0.026, 0.012], [-0.026, -0.012]].forEach(p => {
    const leg = new THREE.Mesh(legGeo, domeMat);
    leg.rotation.x = Math.PI; leg.position.set(p[0], -0.026, p[1]);
    c.add(leg);
  });
  const tail = new THREE.Mesh(new THREE.TorusGeometry(0.020, 0.005, 4, 8, Math.PI * 1.1), domeMat);
  tail.position.set(-0.048, 0.012, 0); tail.rotation.y = Math.PI / 2;
  c.add(tail);
  c.userData.tail = tail;
  return c;
}
function makeMouse() {
  const m = new THREE.Group();
  const mat = new THREE.MeshStandardMaterial({ color: BLUE, roughness: 0.6, flatShading: true });
  const body = new THREE.Mesh(new THREE.IcosahedronGeometry(0.014, 0), mat);
  body.scale.set(1.6, 0.9, 0.9);
  m.add(body);
  const nose = new THREE.Mesh(new THREE.ConeGeometry(0.006, 0.014, 4), mat);
  nose.rotation.z = -Math.PI / 2; nose.position.set(0.026, 0, 0);
  m.add(nose);
  const earGeo = new THREE.IcosahedronGeometry(0.006, 0);
  const earL = new THREE.Mesh(earGeo, mat); earL.position.set(0.006, 0.012, 0.008);
  const earR = new THREE.Mesh(earGeo, mat); earR.position.set(0.006, 0.012, -0.008);
  m.add(earL, earR);
  const tail = new THREE.Mesh(new THREE.CylinderGeometry(0.0022, 0.001, 0.045, 4), mat);
  tail.rotation.z = Math.PI / 2 - 0.4; tail.position.set(-0.032, 0.004, 0);
  m.add(tail);
  return m;
}

const cat = makeCat();
const mouse = makeMouse();
const catY = 0.038, mouseY = 0.016;
cat.position.y = catY; mouse.position.y = mouseY;
root.add(cat, mouse);

/* chase animation: mouse orbits, cat pursues with a lagging angle */
const ORBIT = R * 0.62;
let mA = 0;               /* mouse angle */
let cA = -0.8;            /* cat angle */
const clock = new THREE.Clock();

mindarThree.on('targetFound', () => document.getElementById('hint').classList.add('hidden'));
mindarThree.on('targetLost', () => document.getElementById('hint').classList.remove('hidden'));

function animate() {
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  mA += dt * 1.6;
  /* cat chases: spring toward mouse angle, always a little behind */
  let d = mA - cA;
  d = Math.atan2(Math.sin(d), Math.cos(d));
  cA += dt * (d * 4.0 + 0.9);

  const wob = Math.sin(t * 2.2) * 0.03;  /* mouse weaves */
  const mr = ORBIT * (1 + wob);
  mouse.position.set(Math.cos(mA) * mr, mouseY + Math.abs(Math.sin(t * 14)) * 0.006, Math.sin(mA) * mr);
  mouse.rotation.y = -mA - Math.PI / 2 + Math.sin(t * 9) * 0.15;

  const cr = ORBIT * (1 - wob * 0.5);
  cat.position.set(Math.cos(cA) * cr, catY + Math.abs(Math.sin(t * 10)) * 0.008, Math.sin(cA) * cr);
  cat.rotation.y = -cA - Math.PI / 2;
  cat.userData.tail.rotation.x = Math.sin(t * 6) * 0.4;

  /* dome breathes almost imperceptibly */
  const s = 1 + Math.sin(t * 0.8) * 0.008;
  dome.scale.set(s, 1 + Math.sin(t * 0.8 + 1) * 0.005, s);

  renderer.render(scene, camera);
}

mindarThree.start().then(() => {
  renderer.setAnimationLoop(animate);
}).catch(err => {
  document.getElementById('hint').textContent = 'Camera error: ' + err.message;
});
</script>
</body>
</html>
