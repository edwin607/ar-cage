<script type="module">
import 'https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js';
import * as THREE from 'three';
import { mergeBufferGeometries as mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* Palette sampled from the artwork's linework */
const BLUE = 0x2a3670;
const DRAPE = 0xc0505f;      /* the cloth in the sketch: rgb(210, 96, 112) */
const GREEN = 0x5bbf8a;

const DEBUG = new URLSearchParams(location.search).has('debug');
if (DEBUG) document.body.classList.add('debug');
const debugEl = document.getElementById('debug');

const REDUCED = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const MOTION = REDUCED ? 0.5 : 1.0;

const { MindARThree } = window.MINDAR.IMAGE;
const hint = document.getElementById('hint');

/* ---------- image target: chunked + gzipped, reassembled in-browser ---------- */
async function gunzip(buf) {
  if ('DecompressionStream' in window) {
    const ds = new DecompressionStream('gzip');
    return new Response(new Blob([buf]).stream().pipeThrough(ds)).arrayBuffer();
  }
  const { ungzip } = await import('https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.esm.mjs');
  return ungzip(new Uint8Array(buf)).buffer;
}
async function loadTarget() {
  let parts;
  try {
    const manifest = await (await fetch('./artwork.mind.manifest.json')).json();
    parts = manifest.parts;
  } catch (e) {
    parts = ['aa', 'ab', 'ac', 'ad', 'ae']; /* fallback */
  }
  const bufs = await Promise.all(parts.map(async p =>
    new Uint8Array(await (await fetch('./artwork.mind.gz.' + p)).arrayBuffer())));
  const total = bufs.reduce((n, p) => n + p.length, 0);
  const buf = new Uint8Array(total);
  let off = 0; for (const p of bufs) { buf.set(p, off); off += p.length; }
  const plain = await gunzip(buf);
  return URL.createObjectURL(new Blob([plain]));
}

/* ---------- anchored coordinate space --------------------------------------
   MindAR builds each anchor as  poseMatrix * postMatrix, where postMatrix is
   translate(inputWidth/2, inputHeight/2, 0) * scale(inputWidth): the origin is
   the target image centre and one unit is the target image WIDTH. The pose then
   maps image pixels (y down) into three.js world space (y up), so the anchor's
   own frame ends up as:

       +x = right,  +y = UP the image,  +z = out of the painting (toward you)

   The painting therefore lies in the anchor's XY plane — NOT the XZ plane. The
   scene below is authored y-up (footprint in XZ, height on +Y), which is what
   the orbit-preview wants; AR wraps it in a +90 deg X rotation so that +Y (up)
   becomes +z (out of the painting) and canonical +Z (down the image) becomes -y
   (up the image). The previous build placed the footprint in XZ and its height
   on +y, so the structure lay flat on the painting instead of standing on it.
   The artwork photo is 900x650, so the painting spans 1.0 x 0.7222 and the
   augment's footprint must stay inside that to read as "standing on" it. */
const TARGET_AR = 900 / 650;
const ART_H = 1 / TARGET_AR;      /* 0.7222 — painting height in anchor units */

/* ---------- the cage: proportions read off the artist's sketch -------------
   Measured from the sketch (reference photo, lower half): ~7 distinct
   horizontal member levels, a vertical member at each end, overall
   length/height ~1.14, and a pink cloth over the near end. A 12-gon section is
   what yields exactly 7 distinct rail heights under projection, so the cage is
   a 12-sided barrel lying on the canvas. */
const CAGE = {
  length: 0.50,        /* along the axis, in painting widths */
  radius: 0.215,       /* section circumradius at the near end */
  taper: 0.82,         /* far-end radius / near-end radius (the sketch tapers) */
  belly: 0.05,         /* slight barrel bulge mid-length */
  sides: 12,
  stroke: 0.0042,      /* member thickness — matches the painting's line weight */
  yaw: 0,              /* 0 = axis across the painting, PI/2 = axis into it */
  drapeDepth: 0.075,   /* how far the cloth spills past the near end */
  drapeFlare: 1.20,
  drapeSag: 0.055,
};
CAGE.centreY = CAGE.radius * (1 + CAGE.belly) * Math.cos(Math.PI / CAGE.sides);
/* the cat and mouse circle the floor inside the barrel */
const ORBIT = 0.090;

/* Every cage parameter can be overridden from the URL while art-directing, e.g.
   ?yaw=1.5708&length=0.42&radius=0.18  — handy on a phone next to the painting. */
{
  const qs = new URLSearchParams(location.search);
  for (const k of Object.keys(CAGE)) {
    if (qs.has(k) && !Number.isNaN(parseFloat(qs.get(k)))) CAGE[k] = parseFloat(qs.get(k));
  }
}

/* The mockup shows the structure centred on the painting, so the scene root
   sits at the anchor origin. An earlier build nudged it by (-0.10, 0, -0.05),
   which pushed the whole augment off the painting. */
const ROOT_OFFSET = new THREE.Vector3(0, 0, 0);

/* y-up (authoring) -> MindAR anchor space: +Y (up) becomes +z (out of the painting) */
function toAnchorSpace(object3d) {
  const g = new THREE.Group();
  g.rotation.x = Math.PI / 2;
  g.add(object3d);
  return g;
}

/* Does the cage's ground footprint stay inside the painting (1.0 x ART_H)?
   The footprint is a length x 2radius rectangle, rotated by CAGE.yaw about Y. */
function footprintFits() {
  const hx = CAGE.length / 2, hz = CAGE.radius;
  const c = Math.cos(CAGE.yaw), s = Math.sin(CAGE.yaw);
  let ex = 0, ez = 0;
  for (const [x, z] of [[-hx, -hz], [hx, -hz], [hx, hz], [-hx, hz]]) {
    ex = Math.max(ex, Math.abs(x * c + z * s));
    ez = Math.max(ez, Math.abs(-x * s + z * c));
  }
  return ex <= 0.5 && ez <= ART_H / 2;
}

function buildScene(scene) {
  const root = new THREE.Group();
  root.position.copy(ROOT_OFFSET);
  scene.add(root);

  /* lighting — matte, gallery-flat, and restrained: the mockup's tubes stay a
     deep navy, so keep total brightness near 1.0 or the blue washes out. */
  scene.add(new THREE.AmbientLight(0xffffff, 0.42));
  const key = new THREE.DirectionalLight(0xfff4e0, 0.62);
  key.position.set(0.6, 1.2, 0.9);
  scene.add(key);
  const rim = new THREE.DirectionalLight(0x88aaff, 0.30);
  rim.position.set(-0.8, 0.5, -0.6);
  scene.add(rim);

  /* One colour for the whole structure, exactly as in the mockup: the painting's
     own deep blue, flat-shaded. The old build scattered mustard junction caps
     and a wobble/jitter pass through the geometry; both read as "not the mockup". */
  const blueMat = new THREE.MeshStandardMaterial({
    color: BLUE, roughness: 0.82, metalness: 0, flatShading: true,
  });

  /* ---------- the cage, from the artist's sketch ------------------------------
     The sketch measures out as: ~7 distinct horizontal member levels, a vertical
     member at each end, an overall length/height ratio of ~1.14, and a pink cloth
     draped over the near end. A 12-sided section is what produces exactly 7
     distinct rail heights under projection (cos 15/45/75 deg give 7 levels), so
     the cage is a 12-gon barrel: 12 longitudinal rails, hoops at both ends and
     mid-length, resting its belly on the canvas. */
  const sides = CAGE.sides;
  const halfL = CAGE.length / 2;

  /* section radius along the axis: a slight barrel belly, tapering to the far end */
  const radiusAt = (t) => CAGE.radius * (1 - (1 - CAGE.taper) * t)
                           * (1 + CAGE.belly * Math.sin(Math.PI * t));

  /* Each station is lifted so the lowest facet rests exactly on the canvas: the
     barrel's whole underside touches the artwork instead of floating at the tip. */
  const sectionAt = (t) => {
    const r = radiusAt(t);
    const x = -halfL + t * CAGE.length;
    const yc = r * Math.cos(Math.PI / sides) + 0.002;
    const pts = [];
    for (let k = 0; k < sides; k++) {
      const a = (k + 0.5) * 2 * Math.PI / sides;
      pts.push(new THREE.Vector3(x, yc + r * Math.cos(a), r * Math.sin(a)));
    }
    return pts;
  };
  const STATIONS = [0, 0.25, 0.5, 0.75, 1];
  const HOOPS = [0, 0.5, 1];
  const sections = STATIONS.map(sectionAt);

  /* merge every member + joint into ONE geometry (one draw call) */
  const geos = [];
  const up = new THREE.Vector3(0, 1, 0);
  function strut(a, b) {
    const len = a.distanceTo(b);
    if (len < 1e-6) return;
    const g = new THREE.CylinderGeometry(CAGE.stroke, CAGE.stroke, len, 6, 1, false).toNonIndexed();
    const q = new THREE.Quaternion().setFromUnitVectors(up, b.clone().sub(a).normalize());
    g.applyMatrix4(new THREE.Matrix4().compose(
      a.clone().add(b).multiplyScalar(0.5), q, new THREE.Vector3(1, 1, 1)));
    geos.push(g);
  }
  function joint(p) {
    const g = new THREE.IcosahedronGeometry(CAGE.stroke * 1.6, 0);
    g.translate(p.x, p.y, p.z);
    geos.push(g);
  }

  for (let i = 0; i < STATIONS.length - 1; i++) {          /* longitudinal rails */
    for (let k = 0; k < sides; k++) strut(sections[i][k], sections[i + 1][k]);
  }
  for (const s of HOOPS) {                                  /* hoops */
    const pts = sectionAt(s);
    for (let k = 0; k < sides; k++) strut(pts[k], pts[(k + 1) % sides]);
  }
  for (const pts of sections) for (const p of pts) joint(p);

  const cage = new THREE.Group();
  cage.add(new THREE.Mesh(mergeGeometries(geos, false), blueMat));

  /* The pink cloth thrown over the near end: a flared skirt off the near rim with
     an irregular, sagging hem so it reads as fabric rather than a lid. */
  const near = sectionAt(0);
  const nearR = radiusAt(0);
  const nearYc = nearR * Math.cos(Math.PI / sides) + 0.002;
  const hem = [];
  for (let k = 0; k < sides; k++) {
    const a = (k + 0.5) * 2 * Math.PI / sides;
    /* deterministic irregularity — a hand-thrown cloth, not a lathe */
    const wobble = 1 + 0.10 * Math.sin(k * 2.7) + 0.06 * Math.cos(k * 4.1);
    const rr = nearR * CAGE.drapeFlare * wobble;
    /* the hem hangs lower where the cloth is not pinned (cos a < 0), and spills
       further out in places, so the outline stays soft instead of lathe-like */
    const hemDrop = CAGE.drapeSag * (0.35 + 0.65 * Math.max(0, -Math.cos(a))) * wobble;
    hem.push(new THREE.Vector3(
      -halfL - CAGE.drapeDepth * (0.55 + 0.45 * wobble),
      nearYc - hemDrop + rr * Math.cos(a),
      rr * Math.sin(a)));
  }
  const drape = [];
  for (let k = 0; k < sides; k++) {
    const j = (k + 1) % sides;
    drape.push(near[k], hem[k], hem[j]);
    drape.push(near[k], hem[j], near[j]);
  }
  const drapeGeo = new THREE.BufferGeometry().setFromPoints(drape);
  drapeGeo.computeVertexNormals();
  /* unlit and translucent: lit, the cloth washed out to a pale slab, and the
     sketch's pink is a flat marker colour anyway. depthWrite off so the cage
     reads through it, the way it does in the drawing. */
  cage.add(new THREE.Mesh(drapeGeo, new THREE.MeshBasicMaterial({
    color: DRAPE, side: THREE.DoubleSide, transparent: true, opacity: 0.62,
    depthWrite: false,
  })));

  cage.rotation.y = CAGE.yaw;      /* 0 = axis across the painting, PI/2 = into it */
  root.add(cage);

  /* ---------- cat (blue linework = structure/predator) ---------- */
  function makeCat() {
    const c = new THREE.Group();
    const body = new THREE.Mesh(new THREE.IcosahedronGeometry(0.040, 0), blueMat);
    body.scale.set(1.5, 1.0, 0.9);
    c.add(body);
    const head = new THREE.Mesh(new THREE.IcosahedronGeometry(0.027, 0), blueMat);
    head.position.set(0.057, 0.021, 0);
    c.add(head);
    const earGeo = new THREE.ConeGeometry(0.012, 0.024, 4);
    const earL = new THREE.Mesh(earGeo, blueMat); earL.position.set(0.057, 0.051, 0.013);
    const earR = new THREE.Mesh(earGeo, blueMat); earR.position.set(0.057, 0.051, -0.013);
    c.add(earL, earR);
    const eyeGeo = new THREE.IcosahedronGeometry(0.0045, 0);
    const eyeMat = new THREE.MeshBasicMaterial({ color: 0xffe08a });
    const eL = new THREE.Mesh(eyeGeo, eyeMat); eL.position.set(0.079, 0.028, 0.012);
    const eR = new THREE.Mesh(eyeGeo, eyeMat); eR.position.set(0.079, 0.028, -0.012);
    c.add(eL, eR);
    const legGeo = new THREE.ConeGeometry(0.008, 0.035, 4);
    [[0.030, 0.015], [0.030, -0.015], [-0.036, 0.015], [-0.036, -0.015]].forEach(p => {
      const leg = new THREE.Mesh(legGeo, blueMat);
      leg.rotation.x = Math.PI; leg.position.set(p[0], -0.034, p[1]);
      c.add(leg);
    });
    const tail = new THREE.Mesh(new THREE.TorusGeometry(0.027, 0.006, 4, 8, Math.PI * 1.1), blueMat);
    tail.position.set(-0.064, 0.016, 0); tail.rotation.y = Math.PI / 2;
    c.add(tail);
    c.userData.tail = tail;
    return c;
  }
  /* ---------- mouse (green = emerged from the painting's green node) ---------- */
  function makeMouse() {
    const m = new THREE.Group();
    const mat = new THREE.MeshStandardMaterial({ color: GREEN, roughness: 0.85, metalness: 0, flatShading: true });
    const body = new THREE.Mesh(new THREE.IcosahedronGeometry(0.019, 0), mat);
    body.scale.set(1.6, 0.9, 0.9);
    m.add(body);
    const nose = new THREE.Mesh(new THREE.ConeGeometry(0.008, 0.019, 4), mat);
    nose.rotation.z = -Math.PI / 2; nose.position.set(0.036, 0, 0);
    m.add(nose);
    const earGeo = new THREE.IcosahedronGeometry(0.008, 0);
    const earL = new THREE.Mesh(earGeo, mat); earL.position.set(0.008, 0.017, 0.011);
    const earR = new THREE.Mesh(earGeo, mat); earR.position.set(0.008, 0.017, -0.011);
    m.add(earL, earR);
    const tail = new THREE.Mesh(new THREE.CylinderGeometry(0.003, 0.0012, 0.060, 4), mat);
    tail.rotation.z = Math.PI / 2 - 0.4; tail.position.set(-0.043, 0.006, 0);
    m.add(tail);
    return m;
  }

  const cat = makeCat();
  const mouse = makeMouse();
  const catY = 0.050, mouseY = 0.022;
  cat.position.y = catY; mouse.position.y = mouseY;
  root.add(cat, mouse);

  return { root, cage, cat, mouse, catY, mouseY };
}

/* ---------- chase dramaturgy: CHASE → FREEZE (cat overshoots) → STANDOFF → reverse ---------- */
const actors = (() => {
  let mA = 0, cA = -0.8, dir = 1;
  let state = 'CHASE', stateT = 0, chaseDur = 7;
  let mV = 1.6, cV = 0;
  return {
    step(dt) {
      stateT += dt;
      if (state === 'CHASE') {
        mV = 1.6 * MOTION;
        mA += dir * mV * dt;
        const d = (mA - cA) * dir;
        cV = (d * 4.0 + 0.9) * MOTION;
        cA += dir * cV * dt;
        if (stateT > chaseDur) { state = 'FREEZE'; stateT = 0; mV = 0; }
      } else if (state === 'FREEZE') {
        /* mouse stops dead; cat overshoots and decelerates */
        cV = Math.max(0, cV - dt * 3.0);
        cA += dir * cV * dt;
        if (cV === 0) { state = 'STANDOFF'; stateT = 0; }
      } else if (state === 'STANDOFF') {
        if (stateT > 1.5) {
          state = 'CHASE'; stateT = 0;
          dir *= -1;                       /* mouse bolts the other way */
          chaseDur = 6 + Math.random() * 4;
          cA = mA + dir * 0.6;             /* cat is now ahead */
        }
      }
      return { mA, cA, state };
    }
  };
})();

function animateActors(A, dt, t) {
  const { mA, cA, state } = actors.step(dt);
  const wob = Math.sin(t * 2.2) * 0.05;  /* weave */
  const moving = state === 'CHASE' ? 1 : 0;
  const mr = ORBIT * (1 + wob);
  A.mouse.position.set(Math.cos(mA) * mr, A.mouseY + Math.abs(Math.sin(t * 14)) * 0.006 * moving, Math.sin(mA) * mr);
  A.mouse.rotation.y = -mA - Math.PI / 2 + Math.sin(t * 9) * 0.15 * moving;
  const cr = ORBIT * (1 - wob * 0.5);
  A.cat.position.set(Math.cos(cA) * cr, A.catY + Math.abs(Math.sin(t * 10)) * 0.008 * moving, Math.sin(cA) * cr);
  A.cat.rotation.y = -cA - Math.PI / 2;
  const flick = state === 'STANDOFF' ? 1.8 : 1.0;
  A.cat.userData.tail.rotation.x = Math.sin(t * 6 * flick) * 0.4 * flick;
  if (!REDUCED) {
    const s = 1 + Math.sin(t * 0.8) * 0.008;
    A.cage.scale.set(s, 1 + Math.sin(t * 0.8 + 1) * 0.005, s);
  }
}

/* ---------- ?debug=1: draw the tracked target frame so alignment is checkable
   on a real device. Built directly in anchor space, so it must land exactly on
   the painting in the camera feed — if it does not, tracking (or a mismatch
   between the .mind target and the artwork) is at fault, not the scene. ---------- */
function buildTargetFrame() {
  const g = new THREE.Group();
  const mk = (pts, color, opacity) => {
    const geo = new THREE.BufferGeometry().setFromPoints(pts);
    g.add(new THREE.Line(geo, new THREE.LineBasicMaterial({ color, transparent: true, opacity })));
  };
  const hx = 0.5, hy = ART_H / 2;
  mk([new THREE.Vector3(-hx, -hy, 0), new THREE.Vector3(hx, -hy, 0),
      new THREE.Vector3(hx, hy, 0), new THREE.Vector3(-hx, hy, 0),
      new THREE.Vector3(-hx, -hy, 0)], 0x00ffff, 0.95);
  for (let i = 1; i < 8; i++) {
    const x = -hx + i / 8;
    mk([new THREE.Vector3(x, -hy, 0), new THREE.Vector3(x, hy, 0)], 0x00ffff, 0.35);
  }
  for (let i = 1; i < 6; i++) {
    const y = -hy + (i / 6) * ART_H;
    mk([new THREE.Vector3(-hx, y, 0), new THREE.Vector3(hx, y, 0)], 0x00ffff, 0.35);
  }
  /* axes: +x right (red), +y up the image (blue), +z out of the painting (green) */
  mk([new THREE.Vector3(0, 0, 0), new THREE.Vector3(0.3, 0, 0)], 0xff3355, 1);
  mk([new THREE.Vector3(0, 0, 0), new THREE.Vector3(0, 0.3, 0)], 0x4488ff, 1);
  mk([new THREE.Vector3(0, 0, 0), new THREE.Vector3(0, 0, 0.3)], 0x33ff88, 1);
  return g;
}

/* ---------- boot: AR, or orbit-preview fallback ---------- */
const clock = new THREE.Clock();
const container = document.querySelector('#ar-container');

function onResize(cb) {
  window.addEventListener('resize', cb);
  window.addEventListener('orientationchange', () => setTimeout(cb, 300));
}

async function startAR() {
  const targetUrl = await loadTarget();
  const mindarThree = new MindARThree({
    container,
    imageTargetSrc: targetUrl,
    filterMinCF: 0.0001,
    filterBeta: 0.001,
    missTolerance: 10,
    warmupTolerance: 5,
    renderer: { powerPreference: 'high-performance' },
  });
  const { renderer, scene, camera } = mindarThree;
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.75));
  renderer.setClearColor(0x000000, 0);  /* transparent — camera video must show through */

  const anchor = mindarThree.addAnchor(0);
  const A = buildScene(scene);
  anchor.group.add(toAnchorSpace(A.root));   /* author y-up -> MindAR's XY image plane */
  const frame = buildTargetFrame();
  frame.visible = DEBUG;
  anchor.group.add(frame);

  anchor.onTargetFound = () => {
    hint.classList.add('hidden');
    if (DEBUG) debugEl.dataset.found = '1';
  };
  anchor.onTargetLost = () => {
    hint.classList.remove('hidden');
    if (DEBUG) debugEl.dataset.found = '0';
  };

  /* Alignment probe used by tools/align_test.py and ?debug=1.
     - quad: the target-image rectangle projected to screen pixels. If these do
       not land on the painting's corners, tracking is at fault.
     - upDot: the scene's own up axis vs the painting normal, in camera space.
       It must be ~+1: the structure stands OUT of the painting. Authored in the
       wrong frame it is ~0 and the structure lies flat on the artwork. */
  window.__alignProbe = () => {
    const hx = 0.5, hy = ART_H / 2;
    /* TL, TR, BR, BL in image order (+y is up the image) */
    const pts = [[-hx, hy], [hx, hy], [hx, -hy], [-hx, -hy]];
    const v = new THREE.Vector3();
    const normal = new THREE.Vector3(0, 0, 1)
      .transformDirection(anchor.group.matrixWorld).normalize();
    const up = new THREE.Vector3(0, 1, 0)
      .transformDirection(A.root.matrixWorld).normalize();
    return {
      mode: window.__mode,
      targetFound: hint.classList.contains('hidden'),
      quad: pts.map(([x, y]) => {
        v.set(x, y, 0).applyMatrix4(anchor.group.matrixWorld).project(camera);
        return [Math.round((v.x * 0.5 + 0.5) * container.clientWidth),
                Math.round((-v.y * 0.5 + 0.5) * container.clientHeight)];
      }),
      upDot: Math.round(up.dot(normal) * 1000) / 1000,
      /* the cage's footprint (a length x section rectangle, rotated by yaw) must
         stay inside the painting, which spans 1.0 x ART_H in anchor space */
      footprintFits: footprintFits(),
      viewport: [container.clientWidth, container.clientHeight],
      video: [mindarThree.video ? mindarThree.video.videoWidth : 0,
              mindarThree.video ? mindarThree.video.videoHeight : 0],
      params: { CAGE, ART_H },
    };
  };

  await mindarThree.start();
  /* MindAR computes the camera projection in resize(), which can fire before the
     video stream is ready — leaving a default FOV that misplaces the anchor.
     Re-run it once the stream is live and on orientation changes. */
  mindarThree.resize();
  onResize(() => mindarThree.resize());

  renderer.setAnimationLoop(() => {
    const dt = Math.min(clock.getDelta(), 0.05);
    animateActors(A, dt, clock.elapsedTime);
    renderer.render(scene, camera);
    if (DEBUG) {
      const m = anchor.group.matrix.elements;
      debugEl.textContent =
        `target: ${anchor.group.visible ? 'visible' : 'hidden'}\n` +
        `found:  ${debugEl.dataset.found === '1' ? 'yes' : 'no'}\n` +
        `anchor x=${m[12].toFixed(3)} y=${m[13].toFixed(3)} z=${m[14].toFixed(3)}\n` +
        `root   x=${ROOT_OFFSET.x} z=${ROOT_OFFSET.z}\n` +
        `cage L=${CAGE.length} r=${CAGE.radius} sides=${CAGE.sides} yaw=${CAGE.yaw.toFixed(2)}`;
    }
  });
}

function startPreview() {
  hint.textContent = 'Camera unavailable — drag to explore the augment';
  const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.75));
  renderer.setSize(container.clientWidth, container.clientHeight);
  container.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  /* the artwork as the ground plane the dome sits on (chunked jpg, reassembled) */
  (async () => {
    const bufs = await Promise.all(['aa', 'ab', 'ac'].map(async p =>
      new Uint8Array(await (await fetch('./artwork-target.jpg.' + p)).arrayBuffer())));
    const total = bufs.reduce((n, p) => n + p.length, 0);
    const buf = new Uint8Array(total);
    let off = 0; for (const p of bufs) { buf.set(p, off); off += p.length; }
    const url = URL.createObjectURL(new Blob([buf], { type: 'image/jpeg' }));
    new THREE.TextureLoader().load(url, tex => {
      tex.encoding = THREE.sRGBEncoding;
      const aspect = tex.image.width / tex.image.height;
      const art = new THREE.Mesh(
        new THREE.PlaneGeometry(1, 1 / aspect),
        new THREE.MeshBasicMaterial({ map: tex })
      );
      art.rotation.x = -Math.PI / 2;   /* texture top -> -z, so +z = down the image */
      scene.add(art);
    });
  })();
  const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.01, 10);
  camera.position.set(0.62, 0.78, 1.05);
  const controls = new OrbitControls(camera, renderer.domElement);
  controls.target.set(0.02, 0.10, -0.06);
  controls.enableDamping = true;

  const A = buildScene(scene);

  const resize = () => {
    camera.aspect = container.clientWidth / container.clientHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(container.clientWidth, container.clientHeight);
  };
  onResize(resize);
  renderer.setAnimationLoop(() => {
    const dt = Math.min(clock.getDelta(), 0.05);
    animateActors(A, dt, clock.elapsedTime);
    controls.update();
    renderer.render(scene, camera);
  });
}

/* Probe hooks for the headless smoke test / alignment harness. */
window.__probe = () => ({
  mode: window.__mode,
  anchorFound: document.getElementById('hint').classList.contains('hidden'),
  cage: CAGE,
  footprintFits: footprintFits(),
});

startAR().then(() => { window.__mode = 'ar'; }).catch(err => {
  console.warn('AR start failed, falling back to preview:', err);
  /* MindAR has already injected its <video> (into our container) and its
     loading/scanning overlays (into document.body) by the time start() fails;
     drop both or the preview renders underneath a stuck spinner. */
  container.innerHTML = '';
  document.querySelectorAll('.mindar-ui-overlay').forEach(el => el.remove());
  window.__mode = 'preview';
  startPreview();
});
</script>
</body>
</html>
